name: Verify Campus Recall
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# Each suite is its own job and check. "checks" keeps the previous check name and passes only
# when every suite job succeeded and every S1-S15 statement has executed, passing mapped tests.
jobs:
  static:
    name: Static and fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run check
      - run: npm run format:check
      - run: npm run spec:mapping
      - run: npm run test:fast
      - name: Summarize fast-suite statement evidence
        if: always()
        run: npm run spec:summary -- --only fast --report-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-fast-attempt-${{ github.run_attempt }}
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 14

  browser:
    name: Production browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run release:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Summarize browser statement evidence
        if: always()
        run: npm run spec:summary -- --only browser --report-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-browser-attempt-${{ github.run_attempt }}
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 14

  acceptance:
    name: Actual-model acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .models
          key: public-models-${{ hashFiles('scripts/model-assets.json', 'tests/fixtures/byo-model.json') }}
      # Exercise model setup before any build can create its generated manifest.
      - run: npm run models:download
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:acceptance
      - name: Summarize actual-model statement evidence
        if: always()
        run: npm run spec:summary -- --only acceptance --report-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-acceptance-attempt-${{ github.run_attempt }}
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 14

  pilot:
    name: Pilot storage, browser and model tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Docker containers and development identities are isolated to this runner.
      # No Azure or Google production credentials are used by these tests.
      - run: npm run test:pilot:storage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pilot:e2e
        env:
          PILOT_QA_DIR: test-evidence/pilot-browser/screenshots
      - uses: actions/cache@v4
        with:
          path: .models
          key: public-models-${{ hashFiles('scripts/model-assets.json', 'tests/fixtures/byo-model.json') }}
      - run: npm run models:download
      - run: npm run test:pilot:models
        env:
          CR_PILOT_MODEL_EVIDENCE_DIR: test-evidence/pilot-model
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-validation-attempt-${{ github.run_attempt }}
          path: |
            test-results/pilot-e2e/
            test-evidence/pilot-browser/
            test-evidence/pilot-model/
          if-no-files-found: warn
          retention-days: 14

  checks:
    name: checks
    if: always()
    needs: [static, browser, acceptance, pilot]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Each artifact keeps its own directory, so attempts never overwrite each other.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: evidence-*
          path: test-evidence
      - name: Gate on S1-S15 executed test evidence
        env:
          SOURCE_SHA: ${{ github.sha }}
          CR_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/spec-summary.mjs --sha "$SOURCE_SHA" --out spec-summary
      - name: Require every suite job to succeed
        if: always()
        env:
          STATIC: ${{ needs.static.result }}
          BROWSER: ${{ needs.browser.result }}
          ACCEPTANCE: ${{ needs.acceptance.result }}
          PILOT: ${{ needs.pilot.result }}
        run: |
          status=0
          {
            echo '### Suite jobs'
            for pair in "Static and fast checks=$STATIC" "Production browser tests=$BROWSER" "Actual-model acceptance=$ACCEPTANCE" "Pilot storage, browser and model tests=$PILOT"; do
              echo "- ${pair%%=*}: ${pair#*=}"
              [ "${pair#*=}" = success ] || status=1
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spec-summary-attempt-${{ github.run_attempt }}
          path: spec-summary/
          if-no-files-found: warn
          retention-days: 14
