name: Verify Campus Recall
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run test:fast
      - uses: actions/cache@v4
        with:
          path: .models
          key: public-models-${{ hashFiles('scripts/model-assets.json') }}
      # Exercise model setup before any build can create its generated manifest.
      - run: npm run models:download
      - run: npm run build
      - run: npm run release:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
